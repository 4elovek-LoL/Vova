<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="screen-orientation" content="landscape">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Вова">
    <title>Вова: Охота за яйцами</title>
    <link rel="icon" href="image/player.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* предотвращает выделение текста на кнопках */
        }
        
        body {
            background-color: #000;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('image/background.jpg');
            background-size: cover;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }
        
        .logo {
            width: 20%;
            max-width: 400px;
            margin-bottom: 5vh;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        
        /* центральные кнопки меню */
        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            font-size: 3vh;
            padding: 2vh 4vw;
            margin: 1.5vh 0;
            width: 60%;
            max-width: 300px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* отдельный стиль для кнопки выхода - теперь абсолютное позиционирование снизу справа */
        .exit-corner-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(180, 60, 60, 0.85);
            border: 2px solid rgba(255, 80, 80, 0.8);
            border-radius: 50px;
            color: white;
            font-size: 2.8vh;
            padding: 1.2vh 2.5vw;
            min-width: 110px;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            z-index: 200;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        
        .exit-corner-btn:active {
            transform: scale(0.92);
            background: rgba(220, 70, 70, 1);
            border-color: rgba(255, 120, 120, 0.9);
        }
        
        /* на случай, если нужно также сохранить старую кнопку внутри контейнера — убираем её,
           но предварительно удалим из разметки. Оставляем только флоатинг-кнопку */
        .old-exit-hidden {
            display: none;
        }
        
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .settings-content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 80%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .settings-title {
            font-size: 4vh;
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        
        .setting-item {
            margin-bottom: 25px;
        }
        
        .setting-label {
            display: block;
            font-size: 2.5vh;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .volume-slider {
            width: 100%;
            height: 40px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            outline: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #4ca3af;
            cursor: pointer;
            border: 2px solid white;
        }
        
        .volume-value {
            text-align: center;
            font-size: 2.5vh;
            margin-top: 10px;
            color: #4ca3af;
            font-weight: bold;
        }
        
        .music-select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 2.5vh;
            margin-top: 5px;
        }
        
        .music-select option {
            background: #2a2a2a;
            color: white;
        }
        
        .back-btn {
            background: rgba(76, 163, 175, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            font-size: 2.5vh;
            padding: 1.5vh 3vw;
            margin-top: 20px;
            width: 50%;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .back-btn:active {
            transform: scale(0.95);
            background: rgba(76, 163, 175, 0.9);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .orientation-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .orientation-warning img {
            width: 100px;
            margin-bottom: 30px;
        }
        
        .orientation-warning p {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        /* адаптив для очень маленьких экранов */
        @media (max-width: 600px) {
            .exit-corner-btn {
                bottom: 15px;
                right: 15px;
                font-size: 2.5vh;
                padding: 1vh 4vw;
                min-width: 95px;
            }
        }
        
        /* если режим планшета, кнопка тоже удобно расположена */
        @media (min-width: 1024px) {
            .exit-corner-btn {
                bottom: 30px;
                right: 30px;
                font-size: 2.2vh;
                padding: 1.2vh 2vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image/player.png" alt="Логотип" class="logo">
        <div class="btn" onclick="window.location.href='game.html'">Играть</div>
        <div class="btn" onclick="window.location.href='stats.html'">Статистика</div>
        <div class="btn" onclick="showSettings()">Настройки</div>
        <!-- Старая кнопка выхода из центра удалена, больше не нужна -->
    </div>
    
    <!-- НОВАЯ ПЛАВАЮЩАЯ КНОПКА ВЫХОДА СПРАВА СНИЗУ -->
    <div id="exitCornerButton" class="exit-corner-btn">✕ Выйти ✕</div>
    
    <div class="settings-screen" id="settingsScreen">
        <div class="settings-content">
            <h2 class="settings-title">Настройки</h2>
            <div class="setting-item">
                <label class="setting-label">Громкость музыки:</label>
                <input type="range" min="0" max="100" value="50" class="volume-slider" id="musicVolume">
                <div class="volume-value" id="musicVolumeValue">50%</div>
            </div>
            <div class="setting-item">
                <label class="setting-label">Громкость звуков:</label>
                <input type="range" min="0" max="100" value="50" class="volume-slider" id="soundVolume">
                <div class="volume-value" id="soundVolumeValue">50%</div>
            </div>
            <div class="setting-item">
                <label class="setting-label">Выбор музыки:</label>
                <select class="music-select" id="musicSelect">
                    <option value="classic">Классическая музыка</option>
                    <option value="5x30">5x30</option>
                </select>
            </div>
            <div class="back-btn" onclick="hideSettings()">Назад</div>
        </div>
    </div>
    
    <div class="orientation-warning">
        <img src="image/rotate.png" alt="Поверните устройство">
        <p>Пожалуйста, поверните устройство в горизонтальное положение</p>
    </div>
    
    <script>
        // ========== ФУНКЦИЯ ЗАКРЫТИЯ БРАУЗЕРА (БЕЗ ПРЕДУПРЕЖДЕНИЙ, МАКСИМАЛЬНО АГРЕССИВНАЯ) ==========
        function forceCloseBrowser() {
            // 1) Пытаемся использовать стандартный window.close() — работает в PWA/окнах, открытых через target
            try { 
                window.close(); 
            } catch(e) { /* тихо */ }
            
            // 2) Для Хром/Эдж - специальный протокол, который иногда закрывает вкладку
            try { 
                location.href = 'chrome://close';
            } catch(e) {}
            
            // 3) Создаём временное окно и закрываем текущий контекст через self
            try {
                let blank = window.open('about:blank', '_self');
                if(blank) blank.close();
            } catch(e) {}
            
            // 4) Попытка через пустой редирект и закрытие
            try {
                window.open('', '_self').close();
            } catch(e) {}
            
            // 5) Хак с javascript:close() для некоторых старых версий
            try {
                window.location.href = 'javascript:window.close();';
            } catch(e) {}
            
            // 6) Таймер — экстренная очистка: перезаписываем страницу на пустую, после чего закрываем
            setTimeout(() => {
                try {
                    if (!window.closed) {
                        // Резерв: редирект на пустую страницу и повторная попытка закрытия
                        window.location.replace('about:blank');
                        setTimeout(() => { 
                            try { window.close(); } catch(e) {} 
                        }, 20);
                    }
                } catch(e) {}
            }, 250);
            
            // 7) Дополнительно: для мобильных приложений WebView — пробуем через историю
            setTimeout(() => {
                try {
                    history.back();
                    setTimeout(() => {
                        try { window.close(); } catch(e) {}
                    }, 30);
                } catch(e) {}
            }, 100);
        }
        
        // Полностью отключаем стандартные диалоги подтверждения закрытия страницы
        window.addEventListener('beforeunload', (e) => {
            delete e.returnValue;
            e.preventDefault();
            return undefined;
        });
        window.onbeforeunload = null;
        
        // Предотвращаем любые попытки браузера показать предупреждение при закрытии
        if (window.chrome) {
            window.addEventListener('pagehide', () => {});
        }
        
        // ========== ФУНКЦИИ НАСТРОЕК И СОХРАНЕНИЯ ==========
        function showSettings() {
            const settingsScreen = document.getElementById('settingsScreen');
            if (settingsScreen) settingsScreen.style.display = 'flex';
            const savedMusic = localStorage.getItem('musicVolume');
            const savedMusicType = localStorage.getItem('selectedMusic');
            const savedSound = localStorage.getItem('soundVolume');
            if (savedMusic !== null) {
                document.getElementById('musicVolume').value = savedMusic;
                document.getElementById('musicVolumeValue').textContent = savedMusic + '%';
            }
            if (savedSound !== null) {
                document.getElementById('soundVolume').value = savedSound;
                document.getElementById('soundVolumeValue').textContent = savedSound + '%';
            }
            if (savedMusicType !== null) {
                document.getElementById('musicSelect').value = savedMusicType;
            }
        }
        
        function hideSettings() {
            document.getElementById('settingsScreen').style.display = 'none';
        }
        
        function setupVolumeControl() {
            const musicSlider = document.getElementById('musicVolume');
            const musicValue = document.getElementById('musicVolumeValue');
            const musicSelect = document.getElementById('musicSelect');
            const soundSlider = document.getElementById('soundVolume');
            const soundValue = document.getElementById('soundVolumeValue');
            
            if (musicSlider && musicValue) {
                musicSlider.addEventListener('input', function() {
                    const volume = this.value;
                    musicValue.textContent = volume + '%';
                    localStorage.setItem('musicVolume', volume);
                });
            }
            if (musicSelect) {
                musicSelect.addEventListener('change', function() {
                    localStorage.setItem('selectedMusic', this.value);
                });
            }
            if (soundSlider && soundValue) {
                soundSlider.addEventListener('input', function() {
                    const volume = this.value;
                    soundValue.textContent = volume + '%';
                    localStorage.setItem('soundVolume', volume);
                    testVolume(volume / 100);
                });
            }
            
            const savedVolume = localStorage.getItem('musicVolume');
            const savedMusic = localStorage.getItem('selectedMusic');
            const savedSound = localStorage.getItem('soundVolume');
            if (savedVolume !== null && musicSlider) {
                musicSlider.value = savedVolume;
                if (musicValue) musicValue.textContent = savedVolume + '%';
            }
            if (savedMusic !== null && musicSelect) musicSelect.value = savedMusic;
            if (savedSound !== null && soundSlider) {
                soundSlider.value = savedSound;
                if (soundValue) soundValue.textContent = savedSound + '%';
            }
        }
        
        function testVolume(volume) {
            try {
                const testSound = new Audio('');
                testSound.volume = Math.max(0, Math.min(1, volume));
                testSound.play().catch(e => {});
            } catch(e) {}
        }
        
        function lockOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(e => console.log(e));
            }
        }
        
        async function enterFullscreen() {
            const el = document.documentElement;
            try {
                if (el.requestFullscreen) await el.requestFullscreen();
                else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                else if (el.msRequestFullscreen) await el.msRequestFullscreen();
            } catch (err) {}
        }
        
        // Инициализация окна и главной кнопки выхода в правом нижнем углу
        window.addEventListener('load', () => {
            // Проверка ориентации: если портрет, показываем предупреждение
            if (window.innerHeight > window.innerWidth) {
                const warn = document.querySelector('.orientation-warning');
                if (warn) warn.style.display = 'flex';
            }
            lockOrientation();
            enterFullscreen();
            
            // Создание дефолтных статистик, если отсутствуют
            if (!localStorage.getItem('gameStats')) {
                localStorage.setItem('gameStats', JSON.stringify({
                    totalCoins: 0, totalRareCoins: 0, totalScore: 0,
                    totalDamage: 0, totalBosses: 0, totalGames: 0
                }));
            }
            
            setupVolumeControl();
            
            // Регистрация Service Worker, если доступен
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn(err));
            }
            
            // ========== ГЛАВНОЕ: НАЗНАЧАЕМ НОВУЮ КНОПКУ ВЫХОДА В ПРАВОМ НИЖНЕМ УГЛУ ==========
            const exitBtnCorner = document.getElementById('exitCornerButton');
            if (exitBtnCorner) {
                // Убираем все предыдущие обработчики, чтобы избежать дублирования
                const newCornerBtn = exitBtnCorner.cloneNode(true);
                exitBtnCorner.parentNode.replaceChild(newCornerBtn, exitBtnCorner);
                
                newCornerBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    // Дополнительная вибрация (опционально), чтобы тактильно подтвердить действие
                    if (navigator.vibrate) navigator.vibrate(50);
                    forceCloseBrowser();   // Вызов максимально агрессивного закрытия
                    return false;
                });
                
                // Защита от контекстного меню на кнопке
                newCornerBtn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    return false;
                });
            }
            
            // Блокировка клавиш F5, Ctrl+R и т.п., чтобы не возникало лишних диалогов
            window.addEventListener('keydown', (e) => {
                if (e.key === 'F5' || (e.ctrlKey && (e.key === 'r' || e.key === 'R')) || 
                    (e.metaKey && e.key === 'r') || (e.ctrlKey && e.key === 'w')) {
                    e.preventDefault();
                    return false;
                }
                // Дополнительно блокируем Alt+F4 (но только в контексте предотвращения диалогов)
                if (e.altKey && e.key === 'F4') {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Предотвращаем жест свайпа назад в некоторых браузерах
            window.history.pushState(null, '', window.location.href);
            window.addEventListener('popstate', function(event) {
                window.history.pushState(null, '', window.location.href);
                // Не закрываем, а просто остаёмся на месте
            });
        });
        
        // Контроль ориентации и скрытие предупреждения при ландшафте
        window.addEventListener('resize', () => {
            const warningEl = document.querySelector('.orientation-warning');
            if (window.innerHeight > window.innerWidth) {
                if (warningEl) warningEl.style.display = 'flex';
            } else {
                if (warningEl) warningEl.style.display = 'none';
            }
        });
        
        // Дополнительная инициализация: гарантия, что кнопка в углу всегда активна даже после любых модальных окон
        document.addEventListener('visibilitychange', () => {
            // Небольшая страховка: после возврата вкладки на передний план, если кнопка потеряла событие - перепривязываем
            const exitBtn = document.getElementById('exitCornerButton');
            if (exitBtn && !exitBtn.hasClickListener) {
                // избегаем дублирования, ставим флаг но по-простому — чистим и добавляем заново (без дублирования)
                const freshBtn = exitBtn.cloneNode(true);
                exitBtn.parentNode.replaceChild(freshBtn, exitBtn);
                freshBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (navigator.vibrate) navigator.vibrate(50);
                    forceCloseBrowser();
                });
                freshBtn.hasClickListener = true; // метка
            }
        });
        
        // Дополнительная функция, если понадобится встроенная в консоль для отладки (но не обязана)
        console.log("Главное меню загружено. Кнопка выхода — снизу справа.");
    </script>
</body>
</html>
